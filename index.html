    function App() {
      const [selectedCity, setSelectedCity] = useState('tokyo');
      const [currentTab, setCurrentTab] = useState('home'); 
      const [activeCategory, setActiveCategory] = useState('food');
      const [showTranslateModal, setShowTranslateModal] = useState(false);
      const [showCalcModal, setShowCalcModal] = useState(false);
      const [calcAmount, setCalcAmount] = useState('');
      const [isRecording, setIsRecording] = useState(false);
      const [translatedText, setTranslatedText] = useState('');
      const mapRef = useRef(null);

      const currentData = COUNTRY_DATA[selectedCity] || COUNTRY_DATA['tokyo'];

      // 소스 무단 복제 및 수정을 방지하는 보안 이벤트를 강제 바인딩
      useEffect(() => {
        const preventAction = (e) => e.preventDefault();
        
        // 우클릭, 복사, 잘라내기, 선택 금지
        document.addEventListener('contextmenu', preventAction);
        document.addEventListener('copy', preventAction);
        document.addEventListener('cut', preventAction);

        // F12, Ctrl+Shift+I, Ctrl+U 등 개발자도구/소스보기 단축키 차단
        const handleKeyDown = (e) => {
          if (
            e.keyCode === 123 || 
            (e.ctrlKey && e.shiftKey && e.keyCode === 73) || 
            (e.ctrlKey && e.keyCode === 85) || 
            (e.ctrlKey && e.keyCode === 83)
          ) {
            e.preventDefault();
            return false;
          }
        };
        document.addEventListener('keydown', handleKeyDown);

        return () => {
          document.removeEventListener('contextmenu', preventAction);
          document.removeEventListener('copy', preventAction);
          document.removeEventListener('cut', preventAction);
          document.removeEventListener('keydown', handleKeyDown);
        };
      }, []);

      // 현지 지도 렌더링
      useEffect(() => {
        if (currentTab === 'map') {
          setTimeout(() => {
            if (mapRef.current) mapRef.current.remove();
            const map = L.map('map-container').setView([currentData.lat, currentData.lng], 12);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
            L.marker([currentData.lat, currentData.lng]).addTo(map)
              .bindPopup(`<b>${currentData.name}</b><br>현지 가이드 중심지`)
              .openPopup();
            mapRef.current = map;
          }, 100);
        }
      }, [currentTab, selectedCity]);

      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      }, [selectedCity, currentTab, activeCategory, showTranslateModal, showCalcModal, isRecording]);

      // 가상 파파고 번역
      const handleStartRecord = () => {
        setIsRecording(true);
        setTranslatedText("음성을 듣고 번역 중입니다...");
        setTimeout(() => {
          setIsRecording(false);
          setTranslatedText(`현지어 번역 완료: "${currentData.name.split('-')[1]} 현지인에게 바로 들려주세요!"`);
        }, 1800);
      };

      // 환율 계산
      const calculateKRW = () => {
        if (!calcAmount || isNaN(calcAmount)) return 0;
        if (currentData.currency === 'JPY') {
          return Math.round((parseFloat(calcAmount) / 100) * currentData.rate * 100) / 10;
        } else {
          return Math.round(parseFloat(calcAmount) * currentData.rate);
        }
      };

      return (
        <div className="max-w-md mx-auto bg-slate-50 min-h-screen font-sans text-slate-800 relative shadow-2xl select-none">
          
          {/* HEADER */}
          <header className="bg-gradient-to-r from-blue-700 via-indigo-600 to-blue-600 text-white px-4 py-3.5 flex justify-between items-center sticky top-0 z-50 shadow-md">
            <div className="flex items-center gap-2">
              <span className="bg-yellow-400 text-blue-900 font-black text-xs px-2 py-0.5 rounded-full">T9</span>
              <h1 className="text-xl font-black tracking-wider">톨구로드 <span className="text-blue-200 text-xs font-normal">Tol9u Road</span></h1>
            </div>
            <div className="flex gap-2">
              <button className="p-1.5 bg-white/10 rounded-full"><i data-lucide="bell" className="w-4 h-4"></i></button>
              <button className="p-1.5 bg-white/10 rounded-full"><i data-lucide="user" className="w-4 h-4"></i></button>
            </div>
          </header>

          {/* 1. 도시 선택 & 상단 메인 탭 (홈 / 현지지도 / 번역기 위로 이동) */}
          <section className="bg-gradient-to-r from-blue-700 via-indigo-600 to-blue-600 px-4 pb-3 text-white space-y-3">
            <select 
              value={selectedCity}
              onChange={(e) => setSelectedCity(e.target.value)}
              className="w-full bg-white text-slate-900 font-bold py-2.5 px-4 rounded-xl shadow-lg text-sm focus:outline-none"
            >
              <optgroup label="🇯🇵 일본">
                <option value="tokyo">🇯🇵 일본 - 도쿄</option>
                <option value="osaka">🇯🇵 일본 - 오사카</option>
                <option value="fukuoka">🇯🇵 일본 - 후쿠오카</option>
                <option value="hokkaido">🇯🇵 일본 - 홋카이도(삿포로)</option>
              </optgroup>
              <optgroup label="🇹🇭 태국">
                <option value="bangkok">🇹🇭 태국 - 방콕</option>
                <option value="phuket">🇹🇭 태국 - 푸켓</option>
              </optgroup>
              <optgroup label="🇻🇳 베트남">
                <option value="danang">🇻🇳 베트남 - 다낭</option>
                <option value="nhatrang">🇻🇳 베트남 - 나트랑</option>
                <option value="phuquoc">🇻🇳 베트남 - 푸꾸옥</option>
              </optgroup>
              <optgroup label="🇵🇭 필리핀">
                <option value="cebu">🇵🇭 필리핀 - 세부</option>
                <option value="boracay">🇵🇭 필리핀 - 보라카이</option>
              </optgroup>
              <optgroup label="🇦🇺 호주">
                <option value="sydney">🇦🇺 호주 - 시드니</option>
                <option value="perth">🇦🇺 호주 - 퍼스</option>
                <option value="brisbane">🇦🇺 호주 - 브리즈번</option>
              </optgroup>
              <optgroup label="🇪🇺 유럽">
                <option value="paris">🇫🇷 프랑스 - 파리</option>
                <option value="london">🇬🇧 영국 - 런던</option>
              </optgroup>
              <optgroup label="🇺🇸 미주">
                <option value="hawaii">🇺🇸 미국 - 하와이(호놀룰루)</option>
              </optgroup>
            </select>

            {/* 메인 네비게이션 탭 (위로 이동) */}
            <div className="flex bg-black/20 p-1 rounded-xl text-xs font-bold text-center">
              <button 
                onClick={() => setCurrentTab('home')}
                className={`flex-1 py-1.5 rounded-lg transition ${currentTab === 'home' ? 'bg-white text-blue-900 shadow' : 'text-white/80'}`}
              >
                🏠 홈 가이드
              </button>
              <button 
                onClick={() => setCurrentTab('map')}
                className={`flex-1 py-1.5 rounded-lg transition ${currentTab === 'map' ? 'bg-white text-blue-900 shadow' : 'text-white/80'}`}
              >
                🗺️ 현지 실시간 지도
              </button>
              <button 
                onClick={() => setShowTranslateModal(true)}
                className="flex-1 py-1.5 rounded-lg text-yellow-300 font-extrabold"
              >
                🎙️ 파파고 번역
              </button>
            </div>
          </section>

          {/* 2. 헤드라인 속보 */}
          <section className={`${currentData.alert.level} text-white px-4 py-2.5 flex items-center justify-between text-xs font-semibold shadow-inner`}>
            <div className="flex items-center gap-2 truncate pr-2">
              <span className="font-bold whitespace-nowrap bg-black/25 px-2 py-0.5 rounded">{currentData.alert.type}</span>
              <span className="truncate">{currentData.alert.text}</span>
            </div>
          </section>

          {/* 메인 컨텐츠 영역 */}
          {currentTab === 'home' ? (
            <main className="p-4 space-y-4">
              
              {/* 날씨 카고 */}
              <div className="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 space-y-2">
                <div className="flex items-center justify-between">
                  <div className="flex items-center gap-2 text-blue-600 font-extrabold">
                    <span className="text-2xl">☀️</span>
                    <span className="text-xl">{currentData.weather.temp}</span>
                    <span className="text-xs text-slate-400 font-normal">(체감 {currentData.weather.feels})</span>
                  </div>
                  <span className="text-xs text-slate-400 font-medium">습도 {currentData.weather.humidity}</span>
                </div>
                <p className="text-xs text-slate-600 bg-blue-50/80 p-3 rounded-xl border border-blue-100/80 leading-relaxed">
                  💡 <span className="font-bold text-blue-900">현지 옷차림 팁:</span> {currentData.weather.tip}
                </p>
              </div>

              {/* 4대 퀵 기능 (기능 연동) */}
              <div className="grid grid-cols-4 gap-2">
                <button 
                  onClick={() => setShowTranslateModal(true)}
                  className="bg-white p-3 rounded-2xl shadow-sm border border-slate-100 flex flex-col items-center justify-center gap-1 active:scale-95 transition"
                >
                  <div className="p-2 bg-blue-100 text-blue-600 rounded-xl"><i data-lucide="mic" className="w-4 h-4"></i></div>
                  <span className="text-xs font-bold text-slate-700">파파고번역</span>
                </button>

                <a 
                  href={currentData.appLink} target="_blank"
                  className="bg-white p-3 rounded-2xl shadow-sm border border-slate-100 flex flex-col items-center justify-center gap-1 active:scale-95 transition"
                >
                  <div className="p-2 bg-emerald-100 text-emerald-600 rounded-xl"><i data-lucide="car" className="w-4 h-4"></i></div>
                  <span className="text-xs font-bold text-slate-700">교통호출</span>
                </a>

                <button 
                  onClick={() => setShowCalcModal(true)}
                  className="bg-white p-3 rounded-2xl shadow-sm border border-slate-100 flex flex-col items-center justify-center gap-1 active:scale-95 transition"
                >
                  <div className="p-2 bg-amber-100 text-amber-600 rounded-xl"><i data-lucide="calculator" className="w-4 h-4"></i></div>
                  <span className="text-xs font-bold text-slate-700">환율계산</span>
                </button>

                <a 
                  href={currentData.sos}
                  className="bg-white p-3 rounded-2xl shadow-sm border border-slate-100 flex flex-col items-center justify-center gap-1 active:scale-95 transition"
                >
                  <div className="p-2 bg-rose-100 text-rose-600 rounded-xl"><i data-lucide="phone-call" className="w-4 h-4"></i></div>
                  <span className="text-xs font-bold text-rose-600">영사관SOS</span>
                </a>
              </div>

              {/* 실시간 이슈 TOP 3 */}
              <div className="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 space-y-3">
                <h2 className="text-sm font-extrabold text-slate-900 flex items-center gap-1">
                  🔥 현지 실시간 이슈 TOP 3
                </h2>
                <div className="space-y-2">
                  {currentData.issues.map((issue) => (
                    <div key={issue.id} className="flex justify-between items-center text-xs py-2 border-b border-slate-50 last:border-none">
                      <span className="font-medium text-slate-700 truncate pr-2">{issue.id}. {issue.title}</span>
                      <span className="text-slate-400 font-bold text-[10px] bg-slate-100 px-2 py-0.5 rounded-full whitespace-nowrap">
                        💬 {issue.comments}
                      </span>
                    </div>
                  ))}
                </div>
              </div>

              {/* 카테고리별 여행 정보 */}
              <div className="space-y-3">
                <div className="flex gap-2 overflow-x-auto pb-1 text-xs">
                  {[
                    { id: 'food', label: '🍜 맛집·카페' },
                    { id: 'stay', label: '🛏️ 숙소·치안' },
                    { id: 'transit', label: '🚌 교통 guide' },
                    { id: 'shop', label: '🛍️ 쇼핑·꿀팁' },
                  ].map((tab) => (
                    <button
                      key={tab.id}
                      onClick={() => setActiveCategory(tab.id)}
                      className={`px-3 py-2 rounded-xl font-extrabold whitespace-nowrap transition ${
                        activeCategory === tab.id 
                          ? 'bg-blue-600 text-white shadow-md' 
                          : 'bg-white text-slate-600 border border-slate-100'
                      }`}
                    >
                      {tab.label}
                    </button>
                  ))}
                </div>

                <div className="space-y-3">
                  {currentData.places.map((place) => (
                    <div key={place.id} className="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 space-y-2">
                      <div className="flex justify-between items-start">
                        <div>
                          <h3 className="font-bold text-sm text-slate-900">{place.name}</h3>
                          <span className="text-[11px] text-slate-400">{place.tag}</span>
                        </div>
                        <div className="flex items-center gap-1 text-xs font-black text-amber-500 bg-amber-50 px-2 py-1 rounded-lg">
                          <span>⭐ {place.rating}</span>
                          <span className="text-slate-300 font-normal">({place.reviews})</span>
                        </div>
                      </div>
                      <div className="bg-amber-50/80 p-3 rounded-xl border border-amber-100 text-xs text-amber-950 leading-relaxed">
                        <span className="font-black text-amber-800">💡 톨구 꿀팁: </span>{place.tip}
                      </div>
                    </div>
                  ))}
                </div>
              </div>

            </main>
          ) : (
            /* 실제 지도 노출 탭 */
            <main className="p-4 space-y-3">
              <h2 className="font-bold text-sm text-slate-800">🗺️ {currentData.name} 실시간 지도</h2>
              <div id="map-container" className="w-full h-[450px] rounded-2xl border border-slate-200 shadow-inner"></div>
            </main>
          )}

          {/* 3. 최하단 프레임 (공식문의처 및 저작권 무단 배포 금지 고정 배치) */}
          <footer className="mt-8 p-6 bg-slate-900 text-slate-300 border-t border-slate-800 text-center text-[11px] space-y-3 leading-relaxed">
            <div className="flex justify-center items-center gap-3 text-slate-200 font-bold">
              <button className="hover:underline">이용약관</button>
              <span>|</span>
              <button className="hover:underline text-yellow-400">개인정보처리방침</button>
              <span>|</span>
              <button className="hover:underline">문의처</button>
            </div>

            <div className="text-slate-300 bg-slate-800/60 py-2 px-3 rounded-xl border border-slate-700/50">
              ✉️ 공식 문의처: <a href="mailto:dotol9u@gmail.com" className="font-bold text-yellow-300 underline">dotol9u@gmail.com</a>
            </div>

            <div className="bg-slate-800 p-3.5 rounded-2xl border border-slate-700 text-[10px] text-slate-400 text-left space-y-1.5">
              <p className="font-bold text-yellow-400 flex items-center gap-1">
                🛡️ 저작권 및 무단 복제/배포 금지 안내
              </p>
              <p className="leading-normal">
                본 서비스(톨구로드 / T9 Road)의 모든 데이터, 소스코드, UI 디자인 및 데이터 구조는 저작권법의 보호를 받습니다. 
                소유자의 동의 없는 무단 복제, 2차 가공, 캡처, 소스 유출 및 무단 배포 행위 시 관련 법령에 의해 처벌받을 수 있습니다.
              </p>
            </div>

            <p className="font-extrabold text-slate-500 tracking-wider pt-2">
              by tol9u. All rights reserved.
            </p>
          </footer>

          {/* 파파고 번역 모달 */}
          {showTranslateModal && (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-end justify-center p-4">
              <div className="bg-white w-full max-w-md rounded-3xl p-6 space-y-4">
                <div className="flex justify-between items-center border-b pb-3">
                  <h3 className="font-black text-lg text-slate-900">🎙️ 파파고 퀵 통역기</h3>
                  <button onClick={() => setShowTranslateModal(false)} className="text-slate-400 font-bold text-lg">✕</button>
                </div>
                <div className="bg-slate-100 p-4 rounded-2xl min-h-[100px] flex items-center justify-center text-center text-sm font-bold text-slate-700">
                  {translatedText || "마이크 버튼을 누르고 한국어로 말씀하세요."}
                </div>
                <button 
                  onClick={handleStartRecord}
                  className={`w-full py-4 rounded-2xl font-black text-white shadow-lg transition flex items-center justify-center gap-2 ${
                    isRecording ? 'bg-rose-500 animate-pulse' : 'bg-blue-600 hover:bg-blue-700'
                  }`}
                >
                  <i data-lucide="mic" className="w-5 h-5"></i>
                  {isRecording ? "듣고 있는 중..." : "말하기 시작 (한국어 → 현지어)"}
                </button>
              </div>
            </div>
          )}

          {/* 환율 계산기 모달 */}
          {showCalcModal && (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-end justify-center p-4">
              <div className="bg-white w-full max-w-md rounded-3xl p-6 space-y-4">
                <div className="flex justify-between items-center border-b pb-3">
                  <h3 className="font-black text-lg text-slate-900">💵 실시간 환율 계산기</h3>
                  <button onClick={() => setShowCalcModal(false)} className="text-slate-400 font-bold text-lg">✕</button>
                </div>
                <div className="space-y-3">
                  <div>
                    <label className="text-xs font-bold text-slate-500 block mb-1">현지 금액 입력 ({currentData.currency})</label>
                    <input 
                      type="number" 
                      placeholder="예: 1000"
                      value={calcAmount}
                      onChange={(e) => setCalcAmount(e.target.value)}
                      className="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 font-bold text-slate-900 focus:outline-none"
                    />
                  </div>
                  <div className="bg-amber-50 p-4 rounded-2xl border border-amber-200 text-center">
                    <span className="text-xs text-amber-800 font-bold block">예상 원화 환산 금액</span>
                    <span className="text-2xl font-black text-amber-900">
                      약 {calculateKRW().toLocaleString()} 원
                    </span>
                  </div>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
