<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>톨구로드 (T9 Road)</title>
  <!-- Tailwind CSS & React CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Leaflet OpenStreetMap 지도 라이브러리 -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-100">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const COUNTRY_DATA = {
      tokyo: {
        name: "🇯🇵 일본 - 도쿄",
        lat: 35.6762, lng: 139.6503,
        currency: "JPY", rate: 9.1,
        alert: { type: "⛈️ [LIVE]", text: "도쿄 인근 기습 폭우로 야마노테선 일부 지연 운행 중", level: "bg-amber-500" },
        weather: { temp: "22°C", feels: "21°C", humidity: "55%", tip: "일교차가 큽니다. 가벼운 외투와 접이식 우산을 챙기세요." },
        sos: "tel:03-3452-7401", // 주일본 한국대사관
        appLink: "https://www.go-taxi.jp/ko", // 일본 GO 택시
        issues: [{ id: 1, title: "시부야 돈키호테 면세 대기시간 45분", comments: 32 }],
        places: [{ id: 1, name: "이치란 신주쿠점", rating: "4.2", reviews: "3,400+", tag: "신주쿠 | 라멘", tip: "비밀 소스 5배 추천!" }]
      },
      bangkok: {
        name: "🇹🇭 태국 - 방콕",
        lat: 13.7563, lng: 100.5018,
        currency: "THB", rate: 38.5,
        alert: { type: "🚨 [속보]", text: "스쿰빗 도로 정체 심화, 지하철(BTS) 이용 권장", level: "bg-red-500" },
        weather: { temp: "32°C", feels: "36°C", humidity: "75%", tip: "실내 에어컨이 강하니 얇은 겉옷을 챙기세요." },
        sos: "tel:02-247-7500", // 주태국 한국대사관
        appLink: "https://www.grab.com/th/", // 동남아 그랩
        issues: [{ id: 1, title: "아이콘시암 면세 대기시간 15분", comments: 8 }],
        places: [{ id: 1, name: "팁싸마이", rating: "4.3", reviews: "1,200+", tag: "프라나콘 | 팟타이", tip: "오렌지 주스 꼭 주문하세요!" }]
      },
      danang: {
        name: "🇻🇳 베트남 - 다낭",
        lat: 16.0544, lng: 108.2022,
        currency: "VND", rate: 0.055,
        alert: { type: "🚕 [교통]", text: "공항 호객 행위 주의, Grab 예약 차량만 이용하세요", level: "bg-emerald-600" },
        weather: { temp: "29°C", feels: "32°C", humidity: "78%", tip: "바나힐 이동 시 가디건 필수" },
        sos: "tel:0236-3561-000", // 주다낭 총영사관
        appLink: "https://www.grab.com/vn/",
        issues: [{ id: 1, title: "한시장 아오자이 맞춤 2시간 소요", comments: 34 }],
        places: [{ id: 1, name: "목식당", rating: "4.6", reviews: "4,500+", tag: "미케비치 | 해산물", tip: "크랩 마늘버터 소스 추천" }]
      }
    };

    function App() {
      const [selectedCity, setSelectedCity] = useState('tokyo');
      const [currentTab, setCurrentTab] = useState('home'); // 'home' or 'map'
      const [showTranslateModal, setShowTranslateModal] = useState(false);
      const [showCalcModal, setShowCalcModal] = useState(false);
      const [calcAmount, setCalcAmount] = useState('');
      const mapRef = useRef(null);

      const currentData = COUNTRY_DATA[selectedCity] || COUNTRY_DATA['tokyo'];

      // 지도 표시 로직
      useEffect(() => {
        if (currentTab === 'map') {
          setTimeout(() => {
            if (mapRef.current) mapRef.current.remove();
            const map = L.map('map-container').setView([currentData.lat, currentData.lng], 13);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
            L.marker([currentData.lat, currentData.lng]).addTo(map)
              .bindPopup(`<b>${currentData.name}</b><br>현재 추천 중심지`)
              .openPopup();
            mapRef.current = map;
          }, 100);
        }
      }, [currentTab, selectedCity]);

      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      }, [selectedCity, currentTab, showTranslateModal, showCalcModal]);

      return (
        <div className="max-w-md mx-auto bg-slate-50 min-h-screen pb-32 font-sans text-slate-800 relative shadow-2xl select-none">
          
          {/* HEADER */}
          <header className="bg-blue-600 text-white px-4 py-3 flex justify-between items-center sticky top-0 z-50">
            <h1 className="text-xl font-black">톨구로드 <span className="text-yellow-300 text-xs">(T9 Road)</span></h1>
          </header>

          {/* 도시 선택 */}
          <section className="bg-blue-600 px-4 pb-4 text-white">
            <select 
              value={selectedCity}
              onChange={(e) => setSelectedCity(e.target.value)}
              className="w-full bg-white text-slate-900 font-bold py-2.5 px-4 rounded-xl shadow-md text-sm"
            >
              <option value="tokyo">🇯🇵 일본 - 도쿄</option>
              <option value="bangkok">🇹🇭 태국 - 방콕</option>
              <option value="danang">🇻🇳 베트남 - 다낭</option>
            </select>
          </section>

          {/* 메인 화면 / 지도 화면 분기 */}
          {currentTab === 'home' ? (
            <main className="p-4 space-y-4">
              {/* 속보 */}
              <div className={`${currentData.alert.level} text-white px-3 py-2 rounded-xl text-xs font-bold`}>
                {currentData.alert.type} {currentData.alert.text}
              </div>

              {/* 날씨 */}
              <div className="bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
                <div className="text-lg font-black text-blue-600">☀️ {currentData.weather.temp}</div>
                <p className="text-xs text-slate-600 mt-1">💡 {currentData.weather.tip}</p>
              </div>

              {/* 4대 버튼 (실제 링크 작동 연동) */}
              <div className="grid grid-cols-4 gap-2">
                <button onClick={() => setShowTranslateModal(true)} className="bg-white p-3 rounded-2xl border text-xs font-bold text-slate-700">🎙️ 번역</button>
                <a href={currentData.appLink} target="_blank" className="bg-white p-3 rounded-2xl border text-xs font-bold text-center text-slate-700">🚖 교통호출</a>
                <button onClick={() => setShowCalcModal(true)} className="bg-white p-3 rounded-2xl border text-xs font-bold text-slate-700">💵 환율</button>
                <a href={currentData.sos} className="bg-white p-3 rounded-2xl border text-xs font-bold text-center text-rose-600">🚨 영사관SOS</a>
              </div>

              {/* 맛집 리스트 */}
              <div className="space-y-2">
                <h3 className="font-bold text-sm">🍜 현지 검증 맛집</h3>
                {currentData.places.map(p => (
                  <div key={p.id} className="bg-white p-3 rounded-2xl border text-xs space-y-1">
                    <div className="font-bold">{p.name} ⭐{p.rating}</div>
                    <div className="text-slate-500">💡 {p.tip}</div>
                  </div>
                ))}
              </div>
            </main>
          ) : (
            /* 실제 지도 노출 영역 */
            <main className="p-4 space-y-3">
              <h2 className="font-bold text-sm text-slate-800">🗺️ {currentData.name} 현지 실시간 지도</h2>
              <div id="map-container" className="w-full h-96 rounded-2xl border shadow-inner"></div>
            </main>
          )}

          {/* 푸터 */}
          <footer className="mt-8 pt-6 pb-24 border-t text-center text-slate-400 text-[11px] space-y-1">
            <p>공식 문의처: <a href="mailto:dotol9u@gmail.com" className="underline font-bold text-slate-600">dotol9u@gmail.com</a></p>
            <p className="font-bold">by tol9u. All rights reserved.</p>
          </footer>

          {/* 하단 네비게이션 (홈 vs 현지지도 스위칭) */}
          <nav className="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white border-t px-6 py-3 flex justify-around text-xs font-bold text-slate-500 z-50">
            <button onClick={() => setCurrentTab('home')} className={currentTab === 'home' ? 'text-blue-600' : ''}>🏠 홈</button>
            <button onClick={() => setCurrentTab('map')} className={currentTab === 'map' ? 'text-blue-600' : ''}>🗺️ 현지지도</button>
            <button onClick={() => setShowTranslateModal(true)}>🎙️ 번역기</button>
          </nav>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
