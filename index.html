<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>톨구로드 (T9 Road)</title>
  <!-- Tailwind CSS & React CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Leaflet OpenStreetMap 지도 라이브러리 -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center sm:p-4">
  <div id="root" class="w-full flex justify-center"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // 카테고리별(food, stay, transit, shop) 완전 분리 데이터베이스
    const COUNTRY_DATA = {
      tokyo: {
        name: "🇯🇵 일본 - 도쿄", lat: 35.6762, lng: 139.6503, currency: "JPY", rate: 9.1,
        alert: { type: "⛈️ [LIVE]", text: "도쿄 인근 기습 폭우로 야마노테선 일부 지연 운행 중", level: "bg-amber-500", details: "지바현 및 도쿄 동부 기습 폭우로 야마노테선이 약 15분 지연 운행되고 있습니다.", url: "https://news.google.com/search?q=도쿄+지하철" },
        weather: { temp: "22°C", feels: "21°C", humidity: "55%", tip: "일교차가 큽니다. 가벼운 외투와 접이식 우산을 챙기세요." },
        sos: "tel:03-3452-7401", appLink: "https://www.go-taxi.jp/ko",
        issues: [{ id: 1, title: "시부야 돈키호테 면세 대기시간 45분", comments: 32, content: "면세 카운터 줄이 깁니다. 새벽이나 오전 9시 이전 방문을 추천합니다." }],
        categories: {
          food: [{ id: 1, name: "이치란 신주쿠점", rating: "4.2", reviews: "3,400+", tag: "신주쿠 | 라멘", tip: "비밀 소스 5배 추천!" }],
          stay: [{ id: 1, name: "소테츠 프레사 인 긴자", rating: "4.6", reviews: "1,200+", tag: "긴자 | 🟢 치안 우수 구역", tip: "야간 보행 매우 안전. 여유 있는 일정이 가능합니다." }],
          transit: [{ id: 1, name: "도쿄 메트로 패스 (72시간)", rating: "4.8", reviews: "5,800+", tag: "교통수단 | 패스권", tip: "하루 최소 4회 이상 지하철 탑승 시 무조건 이득!" }],
          shop: [{ id: 1, name: "시부야 메가 돈키호테", rating: "4.4", reviews: "8,900+", tag: "시부야 | 쇼핑몰", tip: "5,000엔 이상 구매 시 면세 + 추가 5% 쿠폰 챙기세요." }]
        }
      },
      bangkok: {
        name: "🇹🇭 태국 - 방콕", lat: 13.7563, lng: 100.5018, currency: "THB", rate: 38.5,
        alert: { type: "🚨 [속보]", text: "스쿰빗 도로 정체 심화, 지하철(BTS) 이용 권장", level: "bg-red-500", details: "도로 정체가 심하니 택시 대신 BTS 지상철을 이용하세요.", url: "https://news.google.com/search?q=방콕+교통" },
        weather: { temp: "32°C", feels: "36°C", humidity: "75%", tip: "실내 에어컨이 강하니 얇은 겉옷을 챙기세요." },
        sos: "tel:02-247-7500", appLink: "https://www.grab.com/th/",
        issues: [{ id: 1, title: "아이콘시암 면세 대기시간 15분", comments: 8, content: "G층 텍스리펀 창구에서 영수증을 챙겨 환급받으세요." }],
        categories: {
          food: [{ id: 1, name: "팁싸마이", rating: "4.3", reviews: "1,200+", tag: "프라나콘 | 팟타이", tip: "오렌지 주스 꼭 주문하세요!" }],
          stay: [{ id: 1, name: "이스틴 그랜드 사톤", rating: "4.7", reviews: "2,100+", tag: "사톤 | 🟢 치안 양호 구역", tip: "BTS 수라싹역과 바로 연결되어 야간 이동 시 안전합니다." }],
          transit: [{ id: 1, name: "그랩(Grab) / 볼트(Bolt)", rating: "4.5", reviews: "9,200+", tag: "교통수단 | 승차호출", tip: "가까운 거리는 볼트가 저렴하고, 출퇴근 시간엔 BTS가 빠릅니다." }],
          shop: [{ id: 1, name: "아이콘시암 (IconSiam)", rating: "4.8", reviews: "12,000+", tag: "클롱산 | 대형쇼핑몰", tip: "G층 쑥시암 실내 야시장에서 길거리 음식과 기념품을 쾌적하게 쇼핑하세요." }]
        }
      },
      danang: {
        name: "🇻🇳 베트남 - 다낭", lat: 16.0544, lng: 108.2022, currency: "VND", rate: 0.055,
        alert: { type: "🚕 [교통]", text: "공항 호객 행위 주의, Grab 예약 차량만 이용하세요", level: "bg-emerald-600", details: "공항 앞 호객 택시 대신 Grab 전용 탑승장을 이용하세요.", url: "https://news.google.com/search?q=다낭+여행" },
        weather: { temp: "29°C", feels: "32°C", humidity: "78%", tip: "바나힐 이동 시 가디건 필수" },
        sos: "tel:0236-3561-000", appLink: "https://www.grab.com/vn/",
        issues: [{ id: 1, title: "한시장 아오자이 맞춤 2시간 소요", comments: 34, content: "원단 선택 후 시내 관광 다녀오시면 완제 제작됩니다." }],
        categories: {
          food: [{ id: 1, name: "목식당", rating: "4.6", reviews: "4,500+", tag: "미케비치 | 해산물", tip: "크랩 마늘버터 소스 추천" }],
          stay: [{ id: 1, name: "신라모노그램 다낭", rating: "4.8", reviews: "950+", tag: "리조트단지 | 🟢 가족형 안심 구역", tip: "프라이빗 비치가 있어 보안이 철저합니다." }],
          transit: [{ id: 1, name: "다낭 그랩(Grab) 택시", rating: "4.6", reviews: "7,400+", tag: "교통수단 | 승차호출", tip: "바나힐이나 호이안 왕복 이동 시 기사와 요금 흥정 후 이용하세요." }],
          shop: [{ id: 1, name: "한시장 (Han Market)", rating: "4.2", reviews: "6,300+", tag: "시내 | 전통시장", tip: "아오자이, 망고, 탑젤리 구매 시 시세표 사전 확인 필수!" }]
        }
      }
    };

    function App() {
      const [selectedCity, setSelectedCity] = useState('tokyo');
      const [currentTab, setCurrentTab] = useState('home'); 
      const [activeCategory, setActiveCategory] = useState('food'); // 'food', 'stay', 'transit', 'shop'
      
      const [showTranslateModal, setShowTranslateModal] = useState(false);
      const [showCalcModal, setShowCalcModal] = useState(false);
      const [selectedIssue, setSelectedIssue] = useState(null);
      const [showNewsModal, setShowNewsModal] = useState(false);
      const [footerModalType, setFooterModalType] = useState(null);

      const [calcAmount, setCalcAmount] = useState('');
      const [isRecording, setIsRecording] = useState(false);
      const [translatedText, setTranslatedText] = useState('');
      const mapRef = useRef(null);

      const currentData = COUNTRY_DATA[selectedCity] || COUNTRY_DATA['tokyo'];
      
      // 현재 선택된 카테고리별 리스트 동적 필터링
      const currentPlaces = currentData.categories ? (currentData.categories[activeCategory] || []) : [];

      // 복제 및 보안 방지
      useEffect(() => {
        const preventAction = (e) => e.preventDefault();
        document.addEventListener('contextmenu', preventAction);
        document.addEventListener('copy', preventAction);
        document.addEventListener('cut', preventAction);

        const handleKeyDown = (e) => {
          if (
            e.keyCode === 123 || 
            (e.ctrlKey && e.shiftKey && e.keyCode === 73) || 
            (e.ctrlKey && e.keyCode === 85) || 
            (e.ctrlKey && e.keyCode === 83)
          ) {
            e.preventDefault();
            return false;
          }
        };
        document.addEventListener('keydown', handleKeyDown);

        return () => {
          document.removeEventListener('contextmenu', preventAction);
          document.removeEventListener('copy', preventAction);
          document.removeEventListener('cut', preventAction);
          document.removeEventListener('keydown', handleKeyDown);
        };
      }, []);

      // 지도 표시
      useEffect(() => {
        if (currentTab === 'map') {
          setTimeout(() => {
            if (mapRef.current) mapRef.current.remove();
            const map = L.map('map-container').setView([currentData.lat, currentData.lng], 12);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
            L.marker([currentData.lat, currentData.lng]).addTo(map)
              .bindPopup(`<b>${currentData.name}</b><br>현지 가이드 중심지`)
              .openPopup();
            mapRef.current = map;
          }, 100);
        }
      }, [currentTab, selectedCity]);

      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      }, [selectedCity, currentTab, activeCategory, showTranslateModal, showCalcModal, selectedIssue, showNewsModal, footerModalType]);

      const handleStartRecord = () => {
        setIsRecording(true);
        setTranslatedText("음성을 듣고 번역 중입니다...");
        setTimeout(() => {
          setIsRecording(false);
          setTranslatedText(`현지어 번역 완료: "${currentData.name.split('-')[1]} 현지인에게 바로 들려주세요!"`);
        }, 1800);
      };

      const calculateKRW = () => {
        if (!calcAmount || isNaN(calcAmount)) return 0;
        if (currentData.currency === 'JPY') {
          return Math.round((parseFloat(calcAmount) / 100) * currentData.rate * 100) / 10;
        } else {
          return Math.round(parseFloat(calcAmount) * currentData.rate);
        }
      };

      return (
        <div className="w-full max-w-md bg-slate-50 min-h-screen sm:min-h-[840px] sm:h-[840px] sm:rounded-[40px] shadow-2xl flex flex-col overflow-hidden relative select-none border-0 sm:border-8 sm:border-slate-800">
          
          {/* 헤더 */}
          <header className="bg-gradient-to-r from-blue-700 via-indigo-600 to-blue-600 text-white px-4 py-3.5 flex justify-between items-center sticky top-0 z-30 shadow-md shrink-0">
            <div className="flex items-center gap-2">
              <span className="bg-yellow-400 text-blue-900 font-black text-xs px-2 py-0.5 rounded-full">T9</span>
              <h1 className="text-xl font-black tracking-wider">톨구로드 <span className="text-blue-200 text-xs font-normal">Tol9u Road</span></h1>
            </div>
          </header>

          {/* 도시 선택 및 메인 탭 */}
          <section className="bg-gradient-to-r from-blue-700 via-indigo-600 to-blue-600 px-4 pb-3 text-white space-y-3 shrink-0">
            <select 
              value={selectedCity}
              onChange={(e) => setSelectedCity(e.target.value)}
              className="w-full bg-white text-slate-900 font-bold py-2.5 px-4 rounded-xl shadow-lg text-sm focus:outline-none cursor-pointer"
            >
              <option value="tokyo">🇯🇵 일본 - 도쿄</option>
              <option value="bangkok">🇹🇭 태국 - 방콕</option>
              <option value="danang">🇻🇳 베트남 - 다낭</option>
            </select>

            <div className="flex bg-black/20 p-1 rounded-xl text-xs font-bold text-center">
              <button 
                onClick={() => setCurrentTab('home')}
                className={`flex-1 py-1.5 rounded-lg transition ${currentTab === 'home' ? 'bg-white text-blue-900 shadow' : 'text-white/80'}`}
              >
                🏠 홈 가이드
              </button>
              <button 
                onClick={() => setCurrentTab('map')}
                className={`flex-1 py-1.5 rounded-lg transition ${currentTab === 'map' ? 'bg-white text-blue-900 shadow' : 'text-white/80'}`}
              >
                🗺️ 현지 지도
              </button>
              <button 
                onClick={() => setShowTranslateModal(true)}
                className="flex-1 py-1.5 rounded-lg text-yellow-300 font-extrabold"
              >
                🎙️ 파파고 번역
              </button>
            </div>
          </section>

          {/* 속보 티커 */}
          <section 
            onClick={() => setShowNewsModal(true)}
            className={`${currentData.alert.level} text-white px-4 py-2.5 flex items-center justify-between text-xs font-semibold shadow-inner cursor-pointer hover:opacity-90 transition shrink-0`}
          >
            <div className="flex items-center gap-2 truncate pr-2">
              <span className="font-bold whitespace-nowrap bg-black/25 px-2 py-0.5 rounded">{currentData.alert.type}</span>
              <span className="truncate">{currentData.alert.text}</span>
            </div>
            <span className="whitespace-nowrap text-yellow-200 underline font-bold">기사보기 ➔</span>
          </section>

          {/* 본문 스크롤 영역 */}
          <div className="flex-1 overflow-y-auto no-scrollbar">
            {currentTab === 'home' ? (
              <main className="p-4 space-y-4">
                {/* 날씨 */}
                <div className="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 space-y-2">
                  <div className="flex items-center justify-between">
                    <div className="flex items-center gap-2 text-blue-600 font-extrabold">
                      <span className="text-2xl">☀️</span>
                      <span className="text-xl">{currentData.weather.temp}</span>
                      <span className="text-xs text-slate-400 font-normal">(체감 {currentData.weather.feels})</span>
                    </div>
                    <span className="text-xs text-slate-400 font-medium">습도 {currentData.weather.humidity}</span>
                  </div>
                  <p className="text-xs text-slate-600 bg-blue-50/80 p-3 rounded-xl border border-blue-100/80 leading-relaxed">
                    💡 <span className="font-bold text-blue-900">현지 옷차림 팁:</span> {currentData.weather.tip}
                  </p>
                </div>

                {/* 4대 퀵 기능 */}
                <div className="grid grid-cols-4 gap-2">
                  <button 
                    onClick={() => setShowTranslateModal(true)}
                    className="bg-white p-3 rounded-2xl shadow-sm border border-slate-100 flex flex-col items-center justify-center gap-1 active:scale-95 transition"
                  >
                    <div className="p-2 bg-blue-100 text-blue-600 rounded-xl"><i data-lucide="mic" className="w-4 h-4"></i></div>
                    <span className="text-xs font-bold text-slate-700">파파고번역</span>
                  </button>

                  <a 
                    href={currentData.appLink} 
                    target="_blank"
                    rel="noopener noreferrer"
                    className="bg-white p-3 rounded-2xl shadow-sm border border-slate-100 flex flex-col items-center justify-center gap-1 active:scale-95 transition"
                  >
                    <div className="p-2 bg-emerald-100 text-emerald-600 rounded-xl"><i data-lucide="car" className="w-4 h-4"></i></div>
                    <span className="text-xs font-bold text-slate-700">교통호출</span>
                  </a>

                  <button 
                    onClick={() => setShowCalcModal(true)}
                    className="bg-white p-3 rounded-2xl shadow-sm border border-slate-100 flex flex-col items-center justify-center gap-1 active:scale-95 transition"
                  >
                    <div className="p-2 bg-amber-100 text-amber-600 rounded-xl"><i data-lucide="calculator" className="w-4 h-4"></i></div>
                    <span className="text-xs font-bold text-slate-700">환율계산</span>
                  </button>

                  <a 
                    href={currentData.sos}
                    className="bg-white p-3 rounded-2xl shadow-sm border border-slate-100 flex flex-col items-center justify-center gap-1 active:scale-95 transition"
                  >
                    <div className="p-2 bg-rose-100 text-rose-600 rounded-xl"><i data-lucide="phone-call" className="w-4 h-4"></i></div>
                    <span className="text-xs font-bold text-rose-600">영사관SOS</span>
                  </a>
                </div>

                {/* 실시간 이슈 */}
                <div className="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 space-y-3">
                  <h2 className="text-sm font-extrabold text-slate-900 flex items-center gap-1">
                    🔥 현지 실시간 이슈 TOP 3 <span className="text-[10px] text-slate-400 font-normal">(클릭 시 상세)</span>
                  </h2>
                  <div className="space-y-2">
                    {currentData.issues.map((issue) => (
                      <div 
                        key={issue.id} 
                        onClick={() => setSelectedIssue(issue)}
                        className="flex justify-between items-center text-xs py-2 border-b border-slate-50 last:border-none cursor-pointer hover:bg-slate-50 px-1 rounded transition"
                      >
                        <span className="font-bold text-slate-800 truncate pr-2">{issue.id}. {issue.title}</span>
                        <span className="text-slate-400 font-bold text-[10px] bg-slate-100 px-2 py-0.5 rounded-full whitespace-nowrap">
                          💬 {issue.comments}
                        </span>
                      </div>
                    ))}
                  </div>
                </div>

                {/* 카테고리 스위칭 탭 & 카드 리스트 */}
                <div className="space-y-3">
                  <div className="flex gap-2 overflow-x-auto pb-1 text-xs no-scrollbar">
                    {[
                      { id: 'food', label: '🍜 맛집·카페' },
                      { id: 'stay', label: '🛏️ 숙소·치안' },
                      { id: 'transit', label: '🚌 교통 guide' },
                      { id: 'shop', label: '🛍️ 쇼핑·꿀팁' },
                    ].map((tab) => (
                      <button
                        key={tab.id}
                        onClick={() => setActiveCategory(tab.id)}
                        className={`px-3.5 py-2 rounded-xl font-extrabold whitespace-nowrap transition cursor-pointer ${
                          activeCategory === tab.id 
                            ? 'bg-blue-600 text-white shadow-md scale-105' 
                            : 'bg-white text-slate-600 border border-slate-100 hover:bg-slate-50'
                        }`}
                      >
                        {tab.label}
                      </button>
                    ))}
                  </div>

                  {/* 동적으로 변경되는 정보 리스트 */}
                  <div className="space-y-3">
                    {currentPlaces.length > 0 ? (
                      currentPlaces.map((place) => (
                        <div key={place.id} className="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 space-y-2 animate-in fade-in duration-200">
                          <div className="flex justify-between items-start">
                            <div>
                              <h3 className="font-bold text-sm text-slate-900">{place.name}</h3>
                              <span className="text-[11px] text-slate-400">{place.tag}</span>
                            </div>
                            <div className="flex items-center gap-1 text-xs font-black text-amber-500 bg-amber-50 px-2 py-1 rounded-lg">
                              <span>⭐ {place.rating}</span>
                              <span className="text-slate-300 font-normal">({place.reviews})</span>
                            </div>
                          </div>
                          <div className="bg-amber-50/80 p-3 rounded-xl border border-amber-100 text-xs text-amber-950 leading-relaxed">
                            <span className="font-black text-amber-800">💡 톨구 꿀팁: </span>{place.tip}
                          </div>
                        </div>
                      ))
                    ) : (
                      <div className="bg-white p-6 rounded-2xl text-center text-xs text-slate-400 border border-slate-100">
                        해당 카테고리의 현지 데이터를 준비 중입니다.
                      </div>
                    )}
                  </div>
                </div>

                {/* 푸터 */}
                <footer className="mt-8 p-6 bg-slate-900 text-slate-300 rounded-2xl text-center text-xs space-y-3">
                  <div className="flex justify-center items-center gap-4 text-slate-200 font-bold">
                    <button onClick={() => setFooterModalType('terms')} className="hover:underline">이용약관</button>
                    <span>|</span>
                    <button onClick={() => setFooterModalType('privacy')} className="hover:underline text-yellow-400">개인정보처리방침</button>
                    <span>|</span>
                    <button onClick={() => setFooterModalType('contact')} className="hover:underline">문의처</button>
                  </div>

                  <p className="font-extrabold text-slate-500 text-[11px] tracking-wider">
                    by tol9u. All rights reserved.
                  </p>
                </footer>

              </main>
            ) : (
              <main className="p-4 space-y-3 h-full flex flex-col">
                <h2 className="font-bold text-sm text-slate-800">🗺️ {currentData.name} 실시간 지도</h2>
                <div id="map-container" className="w-full flex-1 min-h-[400px] rounded-2xl border border-slate-200 shadow-inner"></div>
              </main>
            )}
          </div>

          {/* 모달 창 영역 */}
          {selectedIssue && (
            <div className="absolute inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white w-full rounded-3xl p-6 space-y-4">
                <div className="flex justify-between items-center border-b pb-3">
                  <h3 className="font-black text-base text-slate-900">🔥 실시간 이슈 상세</h3>
                  <button onClick={() => setSelectedIssue(null)} className="text-slate-400 font-bold text-lg">✕</button>
                </div>
                <h4 className="font-bold text-blue-600 text-sm">{selectedIssue.title}</h4>
                <p className="text-xs text-slate-700 leading-relaxed bg-slate-50 p-4 rounded-2xl border border-slate-100">
                  {selectedIssue.content}
                </p>
                <button onClick={() => setSelectedIssue(null)} className="w-full py-3 bg-slate-900 text-white font-bold text-xs rounded-xl">닫기</button>
              </div>
            </div>
          )}

          {showNewsModal && (
            <div className="absolute inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white w-full rounded-3xl p-6 space-y-4">
                <div className="flex justify-between items-center border-b pb-3">
                  <h3 className="font-black text-base text-slate-900">📰 현지 속보 / 기사 상세</h3>
                  <button onClick={() => setShowNewsModal(false)} className="text-slate-400 font-bold text-lg">✕</button>
                </div>
                <div className="space-y-2">
                  <span className="text-xs font-bold px-2 py-0.5 bg-red-100 text-red-600 rounded">{currentData.alert.type}</span>
                  <h4 className="font-bold text-slate-900 text-sm leading-snug">{currentData.alert.text}</h4>
                  <p className="text-xs text-slate-600 bg-slate-50 p-3.5 rounded-2xl border border-slate-100 leading-relaxed">
                    {currentData.alert.details}
                  </p>
                </div>
                <div className="flex gap-2">
                  <a href={currentData.alert.url} target="_blank" rel="noopener noreferrer" className="flex-1 py-3 bg-blue-600 text-white text-center font-bold text-xs rounded-xl">원본 뉴스 보기</a>
                  <button onClick={() => setShowNewsModal(false)} className="py-3 px-4 bg-slate-200 text-slate-700 font-bold text-xs rounded-xl">닫기</button>
                </div>
              </div>
            </div>
          )}

          {footerModalType && (
            <div className="absolute inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white w-full rounded-3xl p-6 space-y-4 max-h-[80vh] overflow-y-auto">
                <div className="flex justify-between items-center border-b pb-3">
                  <h3 className="font-black text-base text-slate-900">
                    {footerModalType === 'terms' && "📜 서비스 이용약관"}
                    {footerModalType === 'privacy' && "🔒 개인정보처리방침 및 저작권"}
                    {footerModalType === 'contact' && "✉️ 공식 문의처"}
                  </h3>
                  <button onClick={() => setFooterModalType(null)} className="text-slate-400 font-bold text-lg">✕</button>
                </div>

                <div className="text-xs text-slate-600 leading-relaxed space-y-2">
                  {footerModalType === 'terms' && (
                    <p>본 서비스(톨구로드 / T9 Road)는 해외 여행객을 위한 종합 정보 제공 앱입니다. 제공되는 데이터 및 정보는 현지 사정에 따라 변경될 수 있습니다.</p>
                  )}
                  {footerModalType === 'privacy' && (
                    <div className="space-y-2">
                      <p><strong>1. 개인정보 처리:</strong> 톨구로드는 별도의 회원가입 없이 이용 가능하며, 개인정보를 수집하지 않습니다.</p>
                      <p><strong>2. 저작권 안내:</strong> 본 서비스의 모든 콘텐츠, 데이터 구조 및 소스코드는 저작권법의 보호를 받습니다. 무단 복제, 2차 가공 및 상업적 배포를 엄격히 금지합니다.</p>
                    </div>
                  )}
                  {footerModalType === 'contact' && (
                    <div className="space-y-2 bg-slate-50 p-4 rounded-2xl border border-slate-100">
                      <p className="font-bold text-slate-800">공식 제휴 및 일반 문의</p>
                      <p>이메일: <a href="mailto:dotol9u@gmail.com" className="text-blue-600 font-bold underline">dotol9u@gmail.com</a></p>
                      <p className="text-[11px] text-slate-400">평일 09:00 ~ 18:00 (주말 및 공휴일 휴무)</p>
                    </div>
                  )}
                </div>

                <button onClick={() => setFooterModalType(null)} className="w-full py-3 bg-slate-900 text-white font-bold text-xs rounded-xl">확인</button>
              </div>
            </div>
          )}

          {showTranslateModal && (
            <div className="absolute inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-end justify-center p-4">
              <div className="bg-white w-full rounded-3xl p-6 space-y-4">
                <div className="flex justify-between items-center border-b pb-3">
                  <h3 className="font-black text-lg text-slate-900">🎙️ 파파고 퀵 통역기</h3>
                  <button onClick={() => setShowTranslateModal(false)} className="text-slate-400 font-bold text-lg">✕</button>
                </div>
                <div className="bg-slate-100 p-4 rounded-2xl min-h-[100px] flex items-center justify-center text-center text-sm font-bold text-slate-700">
                  {translatedText || "마이크 버튼을 누르고 한국어로 말씀하세요."}
                </div>
                <button 
                  onClick={handleStartRecord}
                  className={`w-full py-4 rounded-2xl font-black text-white shadow-lg transition flex items-center justify-center gap-2 ${
                    isRecording ? 'bg-rose-500 animate-pulse' : 'bg-blue-600 hover:bg-blue-700'
                  }`}
                >
                  <i data-lucide="mic" className="w-5 h-5"></i>
                  {isRecording ? "듣고 있는 중..." : "말하기 시작 (한국어 → 현지어)"}
                </button>
              </div>
            </div>
          )}

          {showCalcModal && (
            <div className="absolute inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-end justify-center p-4">
              <div className="bg-white w-full rounded-3xl p-6 space-y-4">
                <div className="flex justify-between items-center border-b pb-3">
                  <h3 className="font-black text-lg text-slate-900">💵 실시간 환율 계산기</h3>
                  <button onClick={() => setShowCalcModal(false)} className="text-slate-400 font-bold text-lg">✕</button>
                </div>
                <div className="space-y-3">
                  <div>
                    <label className="text-xs font-bold text-slate-500 block mb-1">현지 금액 입력 ({currentData.currency})</label>
                    <input 
                      type="number" 
                      placeholder="예: 1000"
                      value={calcAmount}
                      onChange={(e) => setCalcAmount(e.target.value)}
                      className="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 font-bold text-slate-900 focus:outline-none"
                    />
                  </div>
                  <div className="bg-amber-50 p-4 rounded-2xl border border-amber-200 text-center">
                    <span className="text-xs text-amber-800 font-bold block">예상 원화 환산 금액</span>
                    <span className="text-2xl font-black text-amber-900">
                      약 {calculateKRW().toLocaleString()} 원
                    </span>
                  </div>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
