    function App() {
      const [selectedCity, setSelectedCity] = useState('tokyo');
      const [currentTab, setCurrentTab] = useState('home'); 
      const [activeCategory, setActiveCategory] = useState('food'); 
      
      const [showTranslateModal, setShowTranslateModal] = useState(false);
      const [showCalcModal, setShowCalcModal] = useState(false);
      const [footerModalType, setFooterModalType] = useState(null);

      // 전광판 카러셀 인덱스 상태
      const [carouselIndex, setCarouselIndex] = useState(0);

      // 실시간 API 데이터
      const [weatherData, setWeatherData] = useState(null);
      const [weatherLoading, setWeatherDataLoading] = useState(true);
      const [newsData, setNewsData] = useState([]);
      const [newsLoading, setNewsLoading] = useState(true);
      const [exchangeRate, setExchangeRate] = useState(null);
      
      const [calcAmount, setCalcAmount] = useState('');
      
      // 음성 및 번역 상태
      const [isListening, setIsListening] = useState(false);
      const [speechText, setSpeechText] = useState('');
      const [translatedResult, setTranslatedResult] = useState(null);
      const [isTranslating, setIsTranslating] = useState(false);
      const recognitionRef = useRef(null);

      const mapRef = useRef(null);
      const currentData = COUNTRY_DATA[selectedCity] || COUNTRY_DATA['tokyo'];
      const currentPlaces = currentData.categories ? (currentData.categories[activeCategory] || []) : [];

      // 전광판 자동 스위칭 타이머 (3초 마다 자동 전환)
      useEffect(() => {
        setCarouselIndex(0); // 도시 또는 카테고리 변경 시 인덱스 리셋
      }, [selectedCity, activeCategory]);

      useEffect(() => {
        if (currentPlaces.length <= 1) return;
        const interval = setInterval(() => {
          setCarouselIndex((prevIndex) => (prevIndex + 1) % currentPlaces.length);
        }, 3000);
        return () => clearInterval(interval);
      }, [currentPlaces]);

      // 소스 무단 복제 방지
      useEffect(() => {
        const preventAction = (e) => e.preventDefault();
        document.addEventListener('contextmenu', preventAction);
        document.addEventListener('copy', preventAction);
        document.addEventListener('cut', preventAction);

        const handleKeyDown = (e) => {
          if (
            e.keyCode === 123 || 
            (e.ctrlKey && e.shiftKey && e.keyCode === 73) || 
            (e.ctrlKey && e.keyCode === 85) || 
            (e.ctrlKey && e.keyCode === 83)
          ) {
            e.preventDefault();
            return false;
          }
        };
        document.addEventListener('keydown', handleKeyDown);

        return () => {
          document.removeEventListener('contextmenu', preventAction);
          document.removeEventListener('copy', preventAction);
          document.removeEventListener('cut', preventAction);
          document.removeEventListener('keydown', handleKeyDown);
        };
      }, []);

      // 날씨 API
      useEffect(() => {
        setWeatherDataLoading(true);
        fetch(`https://api.open-meteo.com/v1/forecast?latitude=${currentData.lat}&longitude=${currentData.lng}&current=temperature_2m,relative_humidity_2m,apparent_temperature`)
          .then(res => res.json())
          .then(data => {
            if(data && data.current) {
              setWeatherData({
                temp: `${Math.round(data.current.temperature_2m)}°C`,
                feels: `${Math.round(data.current.apparent_temperature)}°C`,
                humidity: `${data.current.relative_humidity_2m}%`
              });
            }
            setWeatherDataLoading(false);
          })
          .catch(() => setWeatherDataLoading(false));
      }, [selectedCity]);

      // 속보 API
      useEffect(() => {
        setNewsLoading(true);
        const rssUrl = `https://news.google.com/rss/search?q=${encodeURIComponent(currentData.searchName + " 여행 속보")}&hl=ko&gl=KR&ceid=KR:ko`;
        fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssUrl)}`)
          .then(res => res.json())
          .then(data => {
            if(data && data.items && data.items.length > 0) {
              setNewsData(data.items.slice(0, 3));
            } else {
              setNewsData([{ title: `${currentData.searchName} 현지 관광지 및 대중교통 정상 운행 중`, link: `https://news.google.com/search?q=${encodeURIComponent(currentData.searchName)}` }]);
            }
            setNewsLoading(false);
          })
          .catch(() => setNewsLoading(false));
      }, [selectedCity]);

      // 환율 API
      useEffect(() => {
        fetch(`https://open.er-api.com/v6/latest/${currentData.currency}`)
          .then(res => res.json())
          .then(data => {
            if(data && data.rates && data.rates.KRW) {
              setExchangeRate(data.rates.KRW);
            }
          })
          .catch(() => setExchangeRate(null));
      }, [selectedCity]);

      // 지도 초기화 (영문 타일)
      useEffect(() => {
        let isMounted = true;
        if (currentTab === 'map') {
          const timer = setTimeout(() => {
            if (!isMounted) return;
            if (mapRef.current) {
              mapRef.current.remove();
              mapRef.current = null;
            }

            const mapContainer = document.getElementById('map-container');
            if (!mapContainer) return;

            const map = L.map('map-container', {
              center: [currentData.lat, currentData.lng],
              zoom: 12,
              zoomControl: true
            });

            L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
              attribution: '&copy; OpenStreetMap &copy; CARTO',
              subdomains: 'abcd',
              maxZoom: 19
            }).addTo(map);

            L.marker([currentData.lat, currentData.lng]).addTo(map)
              .bindPopup(`<b>${currentData.name}</b><br>City Center`)
              .openPopup();

            mapRef.current = map;
          }, 150);

          return () => {
            isMounted = false;
            clearTimeout(timer);
            if (mapRef.current) {
              mapRef.current.remove();
              mapRef.current = null;
            }
          };
        }
      }, [currentTab, selectedCity]);

      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      }, [selectedCity, currentTab, activeCategory, showTranslateModal, showCalcModal, footerModalType, weatherLoading, newsLoading, isListening, speechText, translatedResult, isTranslating, carouselIndex]);

      // 음성 인식 (STT) 토글
      const toggleSpeechRecognition = () => {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
          alert("현재 디바이스의 브라우저에서 음성 인식을 직접 지원하지 않습니다. 텍스트 입력창이나 드롭다운을 이용해 주세요.");
          return;
        }

        if (isListening) {
          if (recognitionRef.current) recognitionRef.current.stop();
          setIsListening(false);
        } else {
          try {
            const recognition = new SpeechRecognition();
            recognition.lang = 'ko-KR';
            recognition.continuous = true;
            recognition.interimResults = true;

            recognition.onstart = () => setIsListening(true);
            recognition.onresult = (event) => {
              let currentTranscript = '';
              for (let i = event.resultIndex; i < event.results.length; i++) {
                currentTranscript += event.results[i][0].transcript;
              }
              setSpeechText(currentTranscript);
            };
            recognition.onerror = () => setIsListening(false);
            recognition.onend = () => setIsListening(false);

            recognition.start();
            recognitionRef.current = recognition;
          } catch (err) {
            setIsListening(false);
          }
        }
      };

      // 화면 내 인앱 번역 수행
      const handleInAppTranslate = () => {
        if(!speechText) return;
        setIsTranslating(true);

        const targetLang = currentData.langCode;
        const apiUrl = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=ko&tl=${targetLang}&dt=t&q=${encodeURIComponent(speechText)}`;

        fetch(apiUrl)
          .then(res => res.json())
          .then(data => {
            if (data && data[0] && data[0][0]) {
              const translatedText = data[0].map(item => item[0]).join('');
              setTranslatedResult({
                original: speechText,
                translated: translatedText,
                langName: currentData.langName,
                ttsLang: currentData.ttsLang
              });
            }
            setIsTranslating(false);
          })
          .catch(() => {
            setTranslatedResult({
              original: speechText,
              translated: `[${currentData.langName} 번역] "${speechText}"`,
              langName: currentData.langName,
              ttsLang: currentData.ttsLang
            });
            setIsTranslating(false);
          });
      };

      // [신규 지원] 현지인용 스피커 음성 출력 (TTS)
      const handleSpeakText = (text, ttsLang) => {
        if (!('speechSynthesis' in window)) {
          alert("현재 브라우저에서 음성 합성(TTS) 기능을 지원하지 않습니다.");
          return;
        }
        window.speechSynthesis.cancel(); // 이전 음성 중단
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = ttsLang || 'ja-JP';
        utterance.rate = 0.9; // 현지인이 똑똑히 들을 수 있도록 약간 천천히 읽기
        window.speechSynthesis.speak(utterance);
      };

      // 환율 계산
      const calculateKRW = () => {
        if (!calcAmount || isNaN(calcAmount)) return 0;
        const rate = exchangeRate || (currentData.currency === 'JPY' ? 9.1 : (currentData.currency === 'VND' ? 0.055 : 1350));
        return Math.round(parseFloat(calcAmount) * rate);
      };

      // 카테고리별 스마트 맞춤 링크 생성 (숙소: 아고다 / 그외: 구글맵)
      const getSmartLink = (place) => {
        if (activeCategory === 'stay') {
          return `https://www.agoda.com/ko-kr/search?text=${encodeURIComponent(place.name + " " + currentData.searchName)}`;
        } else {
          return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(place.name + " " + currentData.searchName)}`;
        }
      };

      return (
        <div className="w-full max-w-md bg-slate-50 min-h-screen sm:min-h-[840px] sm:h-[840px] sm:rounded-[40px] shadow-2xl flex flex-col overflow-hidden relative select-none border-0 sm:border-8 sm:border-slate-800">
          
          {/* 헤더 */}
          <header className="bg-gradient-to-r from-blue-700 via-indigo-600 to-blue-600 text-white px-4 py-3.5 flex justify-between items-center sticky top-0 z-30 shadow-md shrink-0">
            <div className="flex items-center gap-2">
              <span className="bg-yellow-400 text-blue-900 font-black text-xs px-2 py-0.5 rounded-full">T9</span>
              <h1 className="text-xl font-black tracking-wider">톨구로드 <span className="text-blue-200 text-xs font-normal">Tol9u Road</span></h1>
            </div>
          </header>

          {/* 17개 도시 드롭다운 및 상단 메인 탭 */}
          <section className="bg-gradient-to-r from-blue-700 via-indigo-600 to-blue-600 px-4 pb-3 text-white space-y-3 shrink-0">
            <select 
              value={selectedCity}
              onChange={(e) => setSelectedCity(e.target.value)}
              className="w-full bg-white text-slate-900 font-bold py-2.5 px-4 rounded-xl shadow-lg text-sm focus:outline-none cursor-pointer"
            >
              <optgroup label="🇯🇵 일본">
                <option value="tokyo">🇯🇵 일본 - 도쿄</option>
                <option value="osaka">🇯🇵 일본 - 오사카</option>
                <option value="fukuoka">🇯🇵 일본 - 후쿠오카</option>
                <option value="hokkaido">🇯🇵 일본 - 홋카이도(삿포로)</option>
              </optgroup>
              <optgroup label="🇹🇭 태국">
                <option value="bangkok">🇹🇭 태국 - 방콕</option>
                <option value="phuket">🇹🇭 태국 - 푸켓</option>
              </optgroup>
              <optgroup label="🇻🇳 베트남">
                <option value="danang">🇻🇳 베트남 - 다낭</option>
                <option value="nhatrang">🇻🇳 베트남 - 나트랑</option>
                <option value="phuquoc">🇻🇳 베트남 - 푸꾸옥</option>
              </optgroup>
              <optgroup label="🇵🇭 필리핀">
                <option value="cebu">🇵🇭 필리핀 - 세부</option>
                <option value="boracay">🇵🇭 필리핀 - 보라카이</option>
              </optgroup>
              <optgroup label="🇦🇺 호주">
                <option value="sydney">🇦🇺 호주 - 시드니</option>
                <option value="perth">🇦🇺 호주 - 퍼스</option>
                <option value="brisbane">🇦🇺 호주 - 브리즈번</option>
              </optgroup>
              <optgroup label="🇪🇺 유럽">
                <option value="paris">🇫🇷 프랑스 - 파리</option>
                <option value="london">🇬🇧 영국 - 런던</option>
              </optgroup>
              <optgroup label="🇺🇸 미주">
                <option value="hawaii">🇺🇸 미국 - 하와이(호놀룰루)</option>
              </optgroup>
            </select>

            <div className="flex bg-black/20 p-1 rounded-xl text-xs font-bold text-center">
              <button 
                onClick={() => setCurrentTab('home')}
                className={`flex-1 py-1.5 rounded-lg transition cursor-pointer ${currentTab === 'home' ? 'bg-white text-blue-900 shadow' : 'text-white/80'}`}
              >
                🏠 홈 가이드
              </button>
              <button 
                onClick={() => setCurrentTab('map')}
                className={`flex-1 py-1.5 rounded-lg transition cursor-pointer ${currentTab === 'map' ? 'bg-white text-blue-900 shadow' : 'text-white/80'}`}
              >
                🗺️ 현지 지도
              </button>
              <button 
                onClick={() => setShowTranslateModal(true)}
                className="flex-1 py-1.5 rounded-lg text-yellow-300 font-extrabold cursor-pointer"
              >
                🎙️ 번역기
              </button>
            </div>
          </section>

          {/* 속보 티커 */}
          <section className="bg-red-500 text-white px-4 py-2.5 flex items-center justify-between text-xs font-semibold shadow-inner shrink-0">
            <div className="flex items-center gap-2 truncate pr-2">
              <span className="font-bold whitespace-nowrap bg-black/25 px-2 py-0.5 rounded">🚨 [실시간 속보]</span>
              <span className="truncate">
                {newsLoading ? "현지 실시간 속보 수신 중..." : (newsData[0] ? newsData[0].title : "현지 대중교통 및 서비스 정상 운행 중")}
              </span>
            </div>
            {newsData[0] && (
              <a href={newsData[0].link} target="_blank" rel="noopener noreferrer" className="whitespace-nowrap text-yellow-200 underline font-bold">기사보기 ➔</a>
            )}
          </section>

          {/* 본문 스크롤 영역 */}
          <div className="flex-1 overflow-y-auto no-scrollbar">
            {currentTab === 'home' ? (
              <main className="p-4 space-y-4">
                {/* 실시간 날씨 */}
                <div className="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 space-y-2">
                  <div className="flex items-center justify-between">
                    <div className="flex items-center gap-2 text-blue-600 font-extrabold">
                      <span className="text-2xl">☀️</span>
                      <span className="text-xl">{weatherLoading ? "..." : (weatherData ? weatherData.temp : "24°C")}</span>
                      <span className="text-xs text-slate-400 font-normal">(체감 {weatherLoading ? "..." : (weatherData ? weatherData.feels : "23°C")})</span>
                    </div>
                    <span className="text-xs text-slate-400 font-medium">습도 {weatherLoading ? "..." : (weatherData ? weatherData.humidity : "60%")}</span>
                  </div>
                  <p className="text-xs text-slate-600 bg-blue-50/80 p-3 rounded-xl border border-blue-100/80 leading-relaxed">
                    💡 <span className="font-bold text-blue-900">실시간 기온 팁:</span> {currentData.searchName} 현지 실시간 기온에 맞는 복장을 준비하세요.
                  </p>
                </div>

                {/* 4대 퀵 기능 (버튼 명칭: '번역기'로 수정 완료) */}
                <div className="grid grid-cols-4 gap-2">
                  <button 
                    onClick={() => setShowTranslateModal(true)}
                    className="bg-white p-3 rounded-2xl shadow-sm border border-slate-100 flex flex-col items-center justify-center gap-1 active:scale-95 transition cursor-pointer"
                  >
                    <div className="p-2 bg-blue-100 text-blue-600 rounded-xl"><i data-lucide="mic" className="w-4 h-4"></i></div>
                    <span className="text-xs font-bold text-slate-700">번역기</span>
                  </button>

                  <a 
                    href={currentData.appLink} 
                    target="_blank"
                    rel="noopener noreferrer"
                    className="bg-white p-3 rounded-2xl shadow-sm border border-slate-100 flex flex-col items-center justify-center gap-1 active:scale-95 transition"
                  >
                    <div className="p-2 bg-emerald-100 text-emerald-600 rounded-xl"><i data-lucide="car" className="w-4 h-4"></i></div>
                    <span className="text-xs font-bold text-slate-700">교통호출</span>
                  </a>

                  <button 
                    onClick={() => setShowCalcModal(true)}
                    className="bg-white p-3 rounded-2xl shadow-sm border border-slate-100 flex flex-col items-center justify-center gap-1 active:scale-95 transition cursor-pointer"
                  >
                    <div className="p-2 bg-amber-100 text-amber-600 rounded-xl"><i data-lucide="calculator" className="w-4 h-4"></i></div>
                    <span className="text-xs font-bold text-slate-700">환율계산</span>
                  </button>

                  <a 
                    href={currentData.sos}
                    className="bg-white p-3 rounded-2xl shadow-sm border border-slate-100 flex flex-col items-center justify-center gap-1 active:scale-95 transition"
                  >
                    <div className="p-2 bg-rose-100 text-rose-600 rounded-xl"><i data-lucide="phone-call" className="w-4 h-4"></i></div>
                    <span className="text-xs font-bold text-rose-600">영사관SOS</span>
                  </a>
                </div>

                {/* 실시간 라이브 뉴스 */}
                <div className="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 space-y-3">
                  <h2 className="text-sm font-extrabold text-slate-900 flex items-center gap-1">
                    🔥 현지 실시간 라이브 뉴스 TOP 3 <span className="text-[10px] text-slate-400 font-normal">(클릭 시 원본기사)</span>
                  </h2>
                  <div className="space-y-2">
                    {newsLoading ? (
                      <div className="text-xs text-slate-400 py-2">최신 뉴스를 실시간 파싱하고 있습니다...</div>
                    ) : (
                      newsData.map((news, idx) => (
                        <a 
                          key={idx} 
                          href={news.link}
                          target="_blank"
                          rel="noopener noreferrer"
                          className="flex justify-between items-center text-xs py-2 border-b border-slate-50 last:border-none cursor-pointer hover:bg-slate-50 px-1 rounded transition block"
                        >
                          <span className="font-bold text-slate-800 truncate pr-2">{idx + 1}. {news.title}</span>
                          <span className="text-blue-500 font-bold text-[10px] bg-blue-50 px-2 py-0.5 rounded-full whitespace-nowrap">
                            기사보기 ➔
                          </span>
                        </a>
                      ))
                    )}
                  </div>
                </div>

                {/* 전광판 카러셀 및 카테고리 정보 */}
                <div className="space-y-3">
                  <div className="flex gap-2 overflow-x-auto pb-1 text-xs no-scrollbar">
                    {[
                      { id: 'food', label: '🍜 맛집·카페' },
                      { id: 'stay', label: '🛏️ 숙소·치안' },
                      { id: 'transit', label: '🚌 교통 guide' },
                      { id: 'shop', label: '🛍️ 쇼핑·꿀팁' },
                    ].map((tab) => (
                      <button
                        key={tab.id}
                        onClick={() => setActiveCategory(tab.id)}
                        className={`px-3.5 py-2 rounded-xl font-extrabold whitespace-nowrap transition cursor-pointer ${
                          activeCategory === tab.id 
                            ? 'bg-blue-600 text-white shadow-md scale-105' 
                            : 'bg-white text-slate-600 border border-slate-100 hover:bg-slate-50'
                        }`}
                      >
                        {tab.label}
                      </button>
                    ))}
                  </div>

                  {/* 3초마다 바뀌는 실시간 전광판 롤링 메인 카드 */}
                  {currentPlaces.length > 0 ? (
                    <div className="relative">
                      {(() => {
                        const currentPlace = currentPlaces[carouselIndex % currentPlaces.length];
                        const linkUrl = getSmartLink(currentPlace);
                        const isStay = activeCategory === 'stay';

                        return (
                          <a 
                            href={linkUrl}
                            target="_blank"
                            rel="noopener noreferrer"
                            className="block bg-gradient-to-br from-white via-slate-50 to-blue-50/40 p-4 rounded-2xl shadow-md border-2 border-blue-200/80 space-y-2.5 transition transform active:scale-98 cursor-pointer relative overflow-hidden group"
                          >
                            {/* 전광판 배지 라이브 표시 */}
                            <div className="flex justify-between items-center border-b border-slate-100 pb-2">
                              <span className="text-[10px] font-black bg-blue-600 text-white px-2 py-0.5 rounded-full animate-pulse flex items-center gap-1">
                                📡 실시간 롤링 전광판 ({carouselIndex + 1}/{currentPlaces.length})
                              </span>
                              <span className="text-[11px] font-bold text-blue-600 group-hover:underline">
                                {isStay ? "🏨 아고다 예약 ➔" : "🗺️ 구글맵 보기 ➔"}
                              </span>
                            </div>

                            <div className="flex justify-between items-start pt-1">
                              <div>
                                <h3 className="font-extrabold text-base text-slate-900 group-hover:text-blue-700 flex items-center gap-1.5">
                                  {currentPlace.name}
                                </h3>
                                <span className="text-xs text-slate-500 font-medium">{currentPlace.tag}</span>
                              </div>
                              <div className="flex items-center gap-1 text-xs font-black text-amber-500 bg-amber-50 px-2 py-1 rounded-xl border border-amber-200">
                                <span>⭐ {currentPlace.rating}</span>
                                <span className="text-slate-400 font-normal">({currentPlace.reviews})</span>
                              </div>
                            </div>

                            <div className="bg-amber-100/60 p-3 rounded-xl border border-amber-200 text-xs text-amber-950 leading-relaxed">
                              <span className="font-black text-amber-900">💡 톨구 꿀팁: </span>{currentPlace.tip}
                            </div>
                          </a>
                        );
                      })()}

                      {/* 수동 넘김 화통 제어 버튼 */}
                      {currentPlaces.length > 1 && (
                        <div className="flex justify-between items-center mt-2 px-1 text-[11px] text-slate-400 font-bold">
                          <button 
                            onClick={(e) => { e.preventDefault(); setCarouselIndex((prev) => (prev - 1 + currentPlaces.length) % currentPlaces.length); }}
                            className="bg-white border px-2.5 py-1 rounded-lg shadow-sm hover:bg-slate-50 text-slate-700 cursor-pointer"
                          >
                            ◀ 이전 정보
                          </button>
                          <span>3초 자동 전환 중</span>
                          <button 
                            onClick={(e) => { e.preventDefault(); setCarouselIndex((prev) => (prev + 1) % currentPlaces.length); }}
                            className="bg-white border px-2.5 py-1 rounded-lg shadow-sm hover:bg-slate-50 text-slate-700 cursor-pointer"
                          >
                            다음 정보 ▶
                          </button>
                        </div>
                      )}
                    </div>
                  ) : (
                    <div className="bg-white p-6 rounded-2xl text-center text-xs text-slate-400 border border-slate-100">
                      해당 카테고리의 현지 데이터를 준비 중입니다.
                    </div>
                  )}
                </div>

                {/* 푸터 */}
                <footer className="mt-8 p-6 bg-slate-900 text-slate-300 rounded-2xl text-center text-xs space-y-3">
                  <div className="flex justify-center items-center gap-4 text-slate-200 font-bold">
                    <button onClick={() => setFooterModalType('terms')} className="hover:underline cursor-pointer">이용약관</button>
                    <span>|</span>
                    <button onClick={() => setFooterModalType('privacy')} className="hover:underline text-yellow-400 cursor-pointer">개인정보처리방침</button>
                    <span>|</span>
                    <button onClick={() => setFooterModalType('contact')} className="hover:underline cursor-pointer">문의처</button>
                  </div>

                  <p className="font-extrabold text-slate-500 text-[11px] tracking-wider">
                    by tol9u. All rights reserved.
                  </p>
                </footer>

              </main>
            ) : (
              <main className="p-4 space-y-3 h-full flex flex-col">
                <h2 className="font-bold text-sm text-slate-800">🗺️ {currentData.name} 실시간 지도 (영문 표기)</h2>
                <div id="map-container" className="w-full flex-1 min-h-[400px] rounded-2xl border border-slate-200 shadow-inner z-10"></div>
              </main>
            )}
          </div>

          {/* 환율 모달 */}
          {showCalcModal && (
            <div className="absolute inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white w-full rounded-3xl p-6 space-y-4 shadow-2xl animate-in fade-in duration-200">
                <div className="flex justify-between items-center border-b pb-3">
                  <h3 className="font-black text-base text-slate-900">💵 실시간 환율 계산기 ({currentData.currency})</h3>
                  <button onClick={() => setShowCalcModal(false)} className="text-slate-400 hover:text-slate-800 font-bold text-xl px-2 cursor-pointer">✕</button>
                </div>
                <div className="space-y-3">
                  <div>
                    <label className="text-xs font-bold text-slate-500 block mb-1">현지 금액 입력 ({currentData.currency})</label>
                    <input 
                      type="number" 
                      placeholder="예: 1000"
                      value={calcAmount}
                      onChange={(e) => setCalcAmount(e.target.value)}
                      className="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 font-bold text-slate-900 focus:outline-none focus:ring-2 focus:ring-amber-400"
                    />
                  </div>
                  <div className="bg-amber-50 p-4 rounded-2xl border border-amber-200 text-center">
                    <span className="text-xs text-amber-800 font-bold block">실시간 예상 원화 환산 금액</span>
                    <span className="text-2xl font-black text-amber-900">
                      약 {calculateKRW().toLocaleString()} 원
                    </span>
                  </div>
                </div>
                <button onClick={() => setShowCalcModal(false)} className="w-full py-3 bg-slate-900 text-white font-bold text-xs rounded-xl cursor-pointer">닫기</button>
              </div>
            </div>
          )}

          {/* 인앱 번역기 모달 (TTS 현지 스피커 음성 재생 기능 탑재) */}
          {showTranslateModal && (
            <div className="absolute inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white w-full rounded-3xl p-6 space-y-4 shadow-2xl animate-in fade-in duration-200 max-h-[90vh] overflow-y-auto no-scrollbar">
                <div className="flex justify-between items-center border-b pb-3">
                  <h3 className="font-black text-base text-slate-900">🗣️ 실시간 번역기 ({currentData.langName})</h3>
                  <button onClick={() => setShowTranslateModal(false)} className="text-slate-400 hover:text-slate-800 font-bold text-xl px-2 cursor-pointer">✕</button>
                </div>

                {/* 자주 쓰는 표현 선택 */}
                <div>
                  <label className="text-xs font-bold text-slate-500 block mb-1">자주 쓰는 현지 필수 표현 선택</label>
                  <select 
                    onChange={(e) => {
                      setSpeechText(e.target.value);
                      setTranslatedResult(null);
                    }}
                    className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 font-bold text-xs text-slate-800 focus:outline-none cursor-pointer"
                  >
                    {COMMON_PHRASES.map((phrase, idx) => (
                      <option key={idx} value={phrase.value}>{phrase.label}</option>
                    ))}
                  </select>
                </div>

                {/* 텍스트/음성 입력 창 */}
                <div>
                  <label className="text-xs font-bold text-slate-500 block mb-1">한국어 입력 / 음성 인식 내용</label>
                  <textarea 
                    rows="2"
                    placeholder="번역할 내용을 직접 입력하거나 마이크 버튼을 누르세요..."
                    value={speechText}
                    onChange={(e) => {
                      setSpeechText(e.target.value);
                      setTranslatedResult(null);
                    }}
                    className="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 font-bold text-xs text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none"
                  ></textarea>
                  {isListening && (
                    <div className="mt-1 text-xs text-rose-500 font-bold flex items-center gap-1 animate-pulse">
                      🔴 마이크 수신 중... (말이 끝나면 인식 종료를 누르세요)
                    </div>
                  )}
                </div>

                {/* 음성 인식 제어 */}
                <button 
                  onClick={toggleSpeechRecognition}
                  className={`w-full py-2.5 rounded-xl font-extrabold text-xs text-white shadow-sm transition flex items-center justify-center gap-1.5 cursor-pointer ${
                    isListening ? 'bg-rose-500 hover:bg-rose-600 animate-pulse' : 'bg-slate-700 hover:bg-slate-800'
                  }`}
                >
                  <i data-lucide="mic" className="w-4 h-4"></i>
                  {isListening ? "⏹️ 음성 인식 종료하기" : "🎙️ 음성 인식(STT) 마이크 켜기"}
                </button>

                {/* 번역 버튼 */}
                <button 
                  onClick={handleInAppTranslate}
                  disabled={!speechText || isTranslating}
                  className={`w-full py-3.5 rounded-xl font-extrabold text-xs text-white shadow-md transition ${
                    speechText && !isTranslating ? 'bg-blue-600 hover:bg-blue-700 cursor-pointer' : 'bg-slate-300 cursor-not-allowed'
                  }`}
                >
                  {isTranslating ? "실시간 번역 중..." : `✨ ${currentData.langName} 번역하기`}
                </button>

                {/* 현지인용 스피커 출력(TTS) 버튼이 내장된 번역 결과 카드 */}
                {translatedResult && (
                  <div className="bg-blue-50 border-2 border-blue-200 p-4 rounded-2xl space-y-3 animate-in fade-in duration-200">
                    <div className="flex justify-between items-center text-xs font-bold text-blue-900 border-b border-blue-200/60 pb-1.5">
                      <span>현지 번역 결과 ({translatedResult.langName})</span>
                      <span className="text-[10px] text-blue-600">현지인 전달용 📱</span>
                    </div>

                    <div className="text-lg font-black text-slate-900 tracking-wide leading-snug py-1">
                      {translatedResult.translated}
                    </div>

                    {/* [신규 기능] 현지인용 스피커 음성 재생 버튼 */}
                    <button 
                      onClick={() => handleSpeakText(translatedResult.translated, translatedResult.ttsLang)}
                      className="w-full py-2.5 bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-600 hover:to-amber-700 text-white font-extrabold text-xs rounded-xl shadow flex items-center justify-center gap-1.5 transition active:scale-95 cursor-pointer"
                    >
                      <i data-lucide="volume-2" className="w-4 h-4"></i>
                      <span>🔊 현지어로 읽어주기 (스피커 출력)</span>
                    </button>

                    <div className="text-xs font-bold text-slate-500 pt-1 border-t border-blue-200/60">
                      원문: {translatedResult.original}
                    </div>
                  </div>
                )}

                <button onClick={() => setShowTranslateModal(false)} className="w-full py-2 bg-slate-100 text-slate-600 font-bold text-xs rounded-xl cursor-pointer">닫기</button>
              </div>
            </div>
          )}

          {/* 푸터 모달 */}
          {footerModalType && (
            <div className="absolute inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white w-full rounded-3xl p-6 space-y-4 max-h-[80vh] overflow-y-auto">
                <div className="flex justify-between items-center border-b pb-3">
                  <h3 className="font-black text-base text-slate-900">
                    {footerModalType === 'terms' && "📜 서비스 이용약관"}
                    {footerModalType === 'privacy' && "🔒 개인정보처리방침 및 저작권"}
                    {footerModalType === 'contact' && "✉️ 공식 문의처"}
                  </h3>
                  <button onClick={() => setFooterModalType(null)} className="text-slate-400 hover:text-slate-800 font-bold text-xl px-2 cursor-pointer">✕</button>
                </div>

                <div className="text-xs text-slate-600 leading-relaxed space-y-2">
                  {footerModalType === 'terms' && (
                    <p>본 서비스(톨구로드 / T9 Road)는 해외 여행객을 위한 종합 정보 제공 앱입니다. 제공되는 데이터 및 정보는 현지 사정에 따라 변경될 수 있습니다.</p>
                  )}
                  {footerModalType === 'privacy' && (
                    <div className="space-y-2">
                      <p><strong>1. 개인정보 처리:</strong> 톨구로드는 별도의 회원가입 없이 이용 가능하며, 개인정보를 수집하지 않습니다.</p>
                      <p><strong>2. 저작권 안내:</strong> 본 서비스의 모든 콘텐츠, 데이터 구조 및 소스코드는 저작권법의 보호를 받습니다. 무단 복제, 2차 가공 및 상업적 배포를 엄격히 금지합니다.</p>
                    </div>
                  )}
                  {footerModalType === 'contact' && (
                    <div className="space-y-2 bg-slate-50 p-4 rounded-2xl border border-slate-100">
                      <p className="font-bold text-slate-800">공식 제휴 및 일반 문의</p>
                      <p>이메일: <a href="mailto:dotol9u@gmail.com" className="text-blue-600 font-bold underline">dotol9u@gmail.com</a></p>
                      <p className="text-[11px] text-slate-400">평일 09:00 ~ 18:00 (주말 및 공휴일 휴무)</p>
                    </div>
                  )}
                </div>

                <button onClick={() => setFooterModalType(null)} className="w-full py-3 bg-slate-900 text-white font-bold text-xs rounded-xl cursor-pointer">확인</button>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
